{% from "_icons.html" import icon with context %}
<div class="act {{ 'undone' if a.undone }}">{{ icon("check") }}<span>{{ a.summary }}</span>
  {% if a.undo and not a.undone %}<button class="link undo" hx-post="/actions/{{ a.id }}/undo" hx-target="closest .act" hx-swap="outerHTML">{{ _("Undo") }}</button>{% endif %}</div>
