[project]
name = "daily-coach"
version = "0.1.0"
description = "Personal coach that logs your day from free text and adapts training in intervals.icu"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.163.0",
    "uvicorn[standard]==0.54.0",
    "jinja2==3.1.6",
    "psycopg[binary]==3.3.9",
    "psycopg-pool==3.3.3",
    "pydantic-settings==2.16.3",
    "httpx==0.28.1",
    "google-auth[requests]==2.62.2",
    "itsdangerous==2.2.0",
    "cryptography==50.0.2",
    "openai==3.51.0",
    "langfuse==5.2.0",
    "python-multipart==0.0.33",
    "pywebpush==2.5.0",
    "icalendar==7.3.0",
    "recurring-ical-events==3.8.2",
]

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pytest==9.2.0",
    "ruff==0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Form"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint.per-file-ignores]
"evals/*" = ["E501"]
