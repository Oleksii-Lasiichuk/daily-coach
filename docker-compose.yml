# Local Postgres with pgvector, so a demo run needs no Neon account.
# DATABASE_URL=postgresql://coach:coach@localhost:5433/coach
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: coach
      POSTGRES_PASSWORD: coach
      POSTGRES_DB: coach
    ports:
      - "5433:5432"
    volumes:
      - coach-db:/var/lib/postgresql/data
volumes:
  coach-db:
